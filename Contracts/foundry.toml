# ------------------------------------------------------------
# Foundry profile configuration.
# Keep the version in CI (.github/workflows/ci.yml) aligned with
# the local toolchain installed by Foundry.
# ------------------------------------------------------------
# Toolchain pin — keep this in sync with the forge version used in CI
# (.github/workflows/test.yml).
# Bump deliberately; never let it float.
# ------------------------------------------------------------
[toolchain]
channel = "stable"
forge   = "1.1.0"            # pinned Forge version; bump deliberately

[profile.default]
# WrapperContract requires openzeppelin-contracts-upgradeable (not vendored)
skip           = [
  "src/WrapperContract.sol",
  "test/WrapperContract.t.sol",
  "src/CrossChainHandler.sol",
  "src/AutoCompounder.sol",
  "src/RandomSelection.sol",
  "src/MintingPausable.sol",
  "test/MintingPausable.t.sol",
  "test/MintingPausableFuzz.t.sol",
  "src/Burnable.sol",
  "src/DepositLogic.sol",
  "test/DepositLogic.t.sol",
  "src/RewardDistribution.sol",
  "src/WithdrawalLimit.sol",
  "test/WithdrawalLimit.t.sol",
  "src/YieldDistribution.sol",
  "test/YieldDistribution.t.sol",
  "test/LiquidationMath.t.sol",
  "test/MarketArbitration.t.sol",
  "src/Liquidation.sol",
  "test/CollateralVault.t.sol",
  "src/MarketInitializer.sol",
  "test/MarketInitializer.t.sol"
]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.28"
optimizer      = true
optimizer_runs = 200
via_ir         = true
auto_detect_solc = true
offline = false
remappings_file = "remappings.txt"

[profile.default.fuzz]
runs = 256

[profile.ci]
test = "test-ci"
fuzz = { runs = 512 }

[profile.integration]
src = "src/integration"
test = "test/integration"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
