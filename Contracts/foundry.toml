src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.28"
optimizer      = true
optimizer_runs = 200
via_ir         = false
auto_detect_solc = true
offline = false
remappings_file = "remappings.txt"

[profile.default.fuzz]
runs = 256

[profile.ci]
test = "test-ci"
fuzz = { runs = 512 }

[profile.integration]
src = "src/integration"
test = "test/integration"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
