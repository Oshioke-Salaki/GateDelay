[profile.default]
src            = "src"
out            = "../../out/marketfactory"
libs           = ["../../lib"]
test           = "."
script         = "../../script"
solc           = "0.8.28"
optimizer      = true
optimizer_runs = 200
via_ir         = true
auto_detect_solc = true
offline = false
allow_paths = ["..", "../../src", "../../lib"]

remappings = [
  "forge-std/=../../lib/forge-std/src/",
  "@openzeppelin/contracts/=../../lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=../../lib/openzeppelin-contracts/",
  "@prb/math/=../../lib/prb-math/",
  "market-foundation/=../../src/",
]

[profile.ci.fuzz]
runs = 512
