name: Forge Tests

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  # ─── Contracts/test/ suite (uses Contracts/foundry.toml) ─────────────────
  contracts-tests:
    name: Contracts/test/ suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # keep in sync with Contracts/foundry.toml [toolchain] forge

      - name: Show Forge version
        run: forge --version

      - name: Build MarketFactory foundation
        run: forge build --sizes src/MarketFactory.sol
        env:
          FOUNDRY_PROFILE: ci

      - name: Verify MarketFactory ABI artifact
        run: test -s out/MarketFactory.sol/MarketFactory.json && test -s out/PositionToken.sol/PositionToken.json

      - name: Upload market foundation ABIs
        uses: actions/upload-artifact@v4
        with:
          name: market-foundation-abis
          path: |
            Contracts/out/MarketFactory.sol/MarketFactory.json
            Contracts/out/PositionToken.sol/PositionToken.json
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # keep in sync with Contracts/foundry.toml [toolchain] forge

      - name: Show Forge version
        run: forge --version

      - name: Build (root profile)
        run: forge build --sizes

      - name: Prepare isolated MarketFactory test root
        run: cp test/MarketFactory.t.sol test/marketfactory/MarketFactory.t.sol

      - name: Run MarketFactory verification tests
        run: forge test --root test/marketfactory -vvv
        env:
          FOUNDRY_PROFILE: ci
