name: Forge Tests

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Contracts/**'
      - 'test/**'
      - 'foundry.toml'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  # ─── Contracts/test/ suite (uses Contracts/foundry.toml) ─────────────────
  contracts-tests:
    name: Contracts/test/ suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # pinned in package.json/package-lock.json toolchain

      - name: Show Forge version
        run: forge --version

      - name: Build Contracts
        run: forge build --contracts src/MarketCap.sol src/RoleManager.sol

      - name: List test suites (Contracts/test-ci/)
        run: |
          forge test --list --contracts src/MarketCap.sol
          forge test --list --contracts src/RoleManager.sol
        env:
          FOUNDRY_PROFILE: ci

      - name: Run Contracts CI tests
        run: |
          forge test --contracts src/MarketCap.sol -vvv
          forge test --contracts src/RoleManager.sol -vvv
        env:
          FOUNDRY_PROFILE: ci

  # ─── root test/ suite (uses root foundry.toml) ───────────────────────────
  root-tests:
    name: root test/ suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # pinned in package.json/package-lock.json toolchain

      - name: Show Forge version
        run: forge --version

      - name: Build (root profile)
        run: forge build --contracts Contracts/src/CircuitBreaker.sol --skip test
        env:
          FOUNDRY_PROFILE: ci

      - name: List test suites (root test-ci/)
        run: forge test --list --contracts Contracts/src/CircuitBreaker.sol
        env:
          FOUNDRY_PROFILE: ci

      - name: Run root CI tests
        run: forge test --contracts Contracts/src/CircuitBreaker.sol -vvv
        env:
          FOUNDRY_PROFILE: ci
