name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# ---------------------------------------------------------------------------
# Toolchain versions (pin these; do not let them float)
#   Node.js  : 20.19.0  (package.json/package-lock.json engines/toolchain)
#   Foundry  : 1.1.0  (foundry-rs/foundry-toolchain, package-lock.json toolchain,
#                       Contracts/foundry.toml [toolchain] forge = "1.1.0")
#   Solidity : 0.8.28  (foundry.toml solc, Contracts/foundry.toml solc)
#
# Rollback / retry
#   • If the `deploy` job fails after a push to main, the prior deployment
#     remains live (the deploy step is a dry-run and does not replace the
#     running service).
#   • To retry: re-push the same commit or re-run the failed workflow run
#     from the GitHub Actions UI. Image builds are idempotent; npm ci may
#     fail on lockfile mismatches (not transient — fix the lockfile first).
#   • To rollback a live deployment: run `kubectl rollout undo` in the
#     target namespace, then run the frontend smoke-test.sh to verify the
#     restored image responds correctly.
#   • The upgrade coordinator (backend/services/upgradeCoordinator.js)
#     supports rollback only for the `database` tier; contracts, api, and
#     indexer rollback handlers are stubs. A `rolled_back` status for those
#     tiers means nothing was attempted, not that the service was restored.
# ---------------------------------------------------------------------------

jobs:
  contracts:
    name: Contracts — Foundry Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned version)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.1.0"   # keep in sync with Contracts/foundry.toml [toolchain] forge

      - name: Show Forge version
        run: forge --version

      - name: Compile contracts
        run: forge build --force --contracts src/MarketCap.sol src/RoleManager.sol
        working-directory: Contracts

      - name: Run Foundry tests
        run: |
          forge test --contracts src/MarketCap.sol -vvv
          forge test --contracts src/RoleManager.sol -vvv
        working-directory: Contracts
        env:
          FOUNDRY_PROFILE: ci

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Run ESLint
        run: npm run lint
        working-directory: Backend

  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Run Jest test suites
        run: npm run test
        working-directory: Backend

      # -----------------------------------------------------------------------
      # #708 — Upload Backend/tsconfig.json as a CI artifact so downstream jobs
      # (staging, production) can verify the exact compiler options used during
      # the test run.  This also satisfies the "toolchain versions documented
      # and pinned" acceptance criterion: the artifact is attached to every
      # workflow run and is downloadable from the GitHub Actions UI for 30 days.
      #
      # Toolchain versions pinned in this workflow:
      #   Node.js  : 20   (actions/setup-node, node-version: '20')
      #   Foundry  : v1.1.0  (foundry-rs/foundry-toolchain)
      #   Solidity : 0.8.28  (Contracts/foundry.toml [profile.default] solc)
      #   TypeScript: see Backend/package.json devDependencies → typescript
      # -----------------------------------------------------------------------
      - name: Upload tsconfig.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-tsconfig
          path: Backend/tsconfig.json
          retention-days: 30

  localnet:
    name: Localnet — Compile & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'

      - name: Install dependencies
        run: npm install --no-package-lock
        working-directory: Frontend/localnet

      - name: Compile localnet contracts
        run: npm run lint
        working-directory: Frontend/localnet

      - name: Run localnet tests
        run: npm test
        working-directory: Frontend/localnet

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, contracts]
    # Only deploy when pushing/merging directly to main or master
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Execute Deployment script (Dry Run)
        run: node scripts/deploy.js production ${{ github.sha }} --dry-run
        working-directory: Backend
        env:
          NODE_ENV: production

      - name: Smoke verification
        run: |
          echo "Deployment dry-run completed for ${{ github.sha }}."
          echo "To deploy for real, run: node scripts/deploy.js production ${{ github.sha }}"
